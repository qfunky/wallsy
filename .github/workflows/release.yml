name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15 # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project NaviPlay.xcodeproj \
            -scheme NaviPlay \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log || {
              grep -E 'error:|BUILD FAILED' build.log | head -30 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            }

      - name: Package DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x scripts/make_dmg.sh
          ./scripts/make_dmg.sh "${GITHUB_REF_NAME}" "DerivedData/Build/Products/Release/Wallsy.app"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Wallsy-*.dmg
          generate_release_notes: true
          draft: false
          make_latest: "true"
